name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: core_rec_technology
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secretpassword
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo, pdo_pgsql, pgsql, pcntl, posix, bcmath, intl, zip
          ini-values: memory_limit=1G
          tools: composer:v2
          coverage: none

      - name: Setup PNPM
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Create Test Database
        run: |
          php -r '
            $pdo = new PDO("pgsql:host=127.0.0.1;port=5434;dbname=core_rec_technology", "postgres", "secretpassword");
            $exists = $pdo->query("SELECT 1 FROM pg_database WHERE datname = \"core_rec_testing\"")->fetchColumn();
            if (! $exists) {
                $pdo->exec("CREATE DATABASE core_rec_testing;");
            }
          '

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
